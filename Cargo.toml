[package]
name = "cosmic-applet-superpower"
version = "0.1.0"
edition = "2021"

[dependencies.libcosmic]
git = "https://github.com/pop-os/libcosmic.git"
# Pinned to the revision you're building today (from the checkout path
# libcosmic-*/03d7dcb). Bump deliberately, then re-run `cargo build`, commit
# Cargo.lock, and refresh cargoHash in package.nix.
rev = "03d7dcb"
default-features = false
features = ["applet", "tokio", "wayland"]

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
